[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daisy-hil"
version = "0.1.0"
description = "Hardware-in-the-loop audio test rig for Electrosmith Daisy pedals"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
audio = ["sounddevice>=0.4.6", "soundfile>=0.12"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
daisy-hil = "daisyhil.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
daisyhil = ["reporting/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
junit_family = "xunit2"
markers = [
    "hil: requires the Daisy Pod to be attached to the runner (skipped otherwise)",
    "sim: runs against the simulated DSP model",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]
