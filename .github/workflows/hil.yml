name: daisy-hil

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      backend:
        description: 'Backend for the HIL job (sim or audio)'
        required: true
        default: 'sim'
        type: choice
        options: [sim, audio]

jobs:
  unit:
    name: Unit + fault detection (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e '.[dev]'
      - name: Measurement self-verification
        run: pytest tests/unit/test_measurements.py -v --junit-xml=build/unit-junit.xml
      - name: Suite contract
        run: pytest tests/unit/test_suite_contract.py -v --junit-xml=build/contract-junit.xml
      - name: Fault detection (rig must fail when the plant regresses)
        run: pytest tests/unit/test_fault_detection.py -v --junit-xml=build/fault-junit.xml
      - name: Upload unit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-${{ matrix.python }}
          path: build/*.xml

  simulated:
    name: Simulated DSP spec suite (CI, no hardware)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e '.[dev]'
      - name: Run the spec suite against the simulated pedal
        run: |
          daisy-hil run --backend sim --out build
          pytest tests/hil -q --junit-xml=build/hil-sim-junit.xml
      - name: Verify the rig fails when a fault is injected
        run: |
          daisy-hil run --backend sim --out build-faulty --fault delay_drift_pct=25 || true
          test ! -f build-faulty/report.html || grep -q "FAIL" build-faulty/report.html
      - name: Upload simulated report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hil-sim
          path: |
            build/
            build-faulty/
      - name: Publish JUnit results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: 'build/*.xml'
          check_name: Unit + simulated results

  hardware:
    name: Hardware-in-the-loop (Daisy Pod attached)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.backend == 'audio'
    runs-on: [self-hosted, hil, daisy]
    needs: simulated
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install (with audio deps)
        run: pip install -e '.[audio,dev]'
      - name: List audio devices (triage)
        run: daisy-hil devices
      - name: Run the spec suite against the attached Pod
        env:
          HIL_BACKEND: audio
        run: |
          daisy-hil run --backend audio --out build-hw --save-captures
          pytest tests/hil -q --junit-xml=build-hw/junit.xml
      - name: Upload hardware report and captures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hil-hardware
          path: |
            build-hw/
      - name: Publish hardware JUnit results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: 'build-hw/junit.xml'
          check_name: Hardware-in-the-loop results